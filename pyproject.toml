[project]
name = "optimize-jeepney-routes-nsga2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "folium>=0.20.0",
    "geojson>=3.3.0",
    "geopandas>=1.2.0",
    "geopy>=2.5.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "osmnx>=2.1.1",
    "pandas>=3.0.6",
    "rtree>=1.4.1",
    "scipy>=1.18.1",
    "utm>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
